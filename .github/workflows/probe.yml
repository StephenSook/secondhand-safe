name: probe

# Live probe of the judged deployment (PLAN 2.1). Stays ON through judging. Offset minutes because
# GitHub deprioritizes :00 and */N schedules; judge freshness by the newest run's age, not by green runs.
# Both public origins are probed: the judged domain and the Vercel alias it points at.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["https://lullabuy.tech", "https://secondhand-safe-web.vercel.app"]
    steps:
      - name: Real recall check, stats, health, Atlas deals and MCP answer from production
        env:
          BASE: ${{ matrix.base }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["BASE"]
          def get(p):
              with urllib.request.urlopen(base + p, timeout=30) as r:
                  assert r.status == 200, (p, r.status)
                  return json.loads(r.read())
          v = get("/api/check?model=BHC001&batch=202408")["verdict"]
          assert v["kind"] == "RECALL_MATCH" and v["recall"]["recallNumber"] == "26061", v
          assert get("/api/check?model=BHC001&batch=202511")["verdict"]["kind"] == "NEEDS_CHECK"
          s = get("/api/stats")
          assert s["recallIndex"]["recalls"] > 1000 and s["classifier"]["macroF1"] > s["classifier"]["zeroShotMacroF1"], s
          h = get("/api/health")
          # visaDirect is intentionally off (Visa Direct not enabled on the project), so require only the live set
          live = ["visa", "mongo", "gemini", "elevenlabs", "tap", "solana", "recallCall"]
          assert h["ok"] is True and all(h["integrations"].get(k) is True for k in live), h
          d = get("/api/deals")
          assert isinstance(d["recent"], list), d
          req = urllib.request.Request(base + "/api/mcp",
              data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list"}).encode(),
              headers={"content-type": "application/json", "accept": "application/json, text/event-stream"})
          with urllib.request.urlopen(req, timeout=30) as r:
              tools = [t["name"] for t in json.loads(r.read())["result"]["tools"]]
          assert "recall_check" in tools, tools
          with urllib.request.urlopen(base + "/", timeout=30) as r:
              body = r.read()
          assert b"Lullabuy" in body, "homepage does not carry the product name"
          print("probe ok", base, h["integrations"], "deals", len(d["recent"]), "tools", tools)
          PY
